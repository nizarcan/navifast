[package]
name = "navifast"
default-run = "navifast"
version = "0.1.0-rc.24"
edition = "2024"
rust-version = "1.98"
license = "MIT"
description = "A native Navidrome client"
repository = "https://github.com/nizarcan/navifast"
keywords = ["navidrome", "subsonic", "music", "rune", "player"]
categories = ["multimedia::audio"]

[lib]
name = "navifast"
path = "src/lib.rs"

[[bin]]
name = "navifast"
path = "src/navifast.rs"

# Compatibility command for scripts and the updater in earlier releases.
[[bin]]
name = "fastpotify"
path = "src/main.rs"

[dependencies]
# Native window, renderer and accessible controls for the Navidrome presentation.
# Rune's native file chooser provides local PNG export on all three platforms.
rune = { git = "https://github.com/anomalyco/rune", rev = "7ead7d63fcf6f9dd9669385a8b90e2ae80015d7b", default-features = false, features = ["accessibility", "metal-backend", "dbus", "svg", "native-file-dialog"] }
# Use Rune's existing GPU device for the dithered native backdrop.
wgpu = { version = "~30.0.1", default-features = false, features = ["wgsl"] }
anyhow = "1"
thiserror = "2"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# LRCLIB's word-timed Lyricsfile format is YAML. Bound parsing work without a DOM.
serde-saphyr = { version = "2.1.1", default-features = false, features = ["deserialize"] }
# Read and update the window geometry in existing eframe app.ron profiles.
ron = "0.12"
log = "0.4"
# Keep the existing native log output without a framework wrapper.
env_logger = "0.11"
directories = "6"
# One protected-store API, with only each target's native provider below.
# Durable credentials must not be copied into ordinary state JSON.
keyring-core = "1"
# Catalogs compiled from PO files at build time (see build.rs) and the
# system's preferred languages. No libintl or runtime catalog parsing.
tr = { version = "0.1.11", default-features = false }
sys-locale = "0.3"
# Reuse the logger's existing clock dependency for UTC listening-summary timestamps.
jiff = { version = "0.2", default-features = false, features = ["std"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
# Rune already uses resvg. Render the app mark with its established alpha rounding.
resvg = { version = "0.45.1", default-features = false }
# Restore native window placement and mode.
raw-window-handle = "0.6"
# Native audio output for streamed and decoded PCM.
rodio = { version = "0.21", default-features = false, features = ["playback"] }
# Decode Navidrome's original files while retaining our PCM EQ/visualizer path.
# Enable the library codecs handled by the existing decoder.
symphonia = { version = "0.5.5", features = ["aac", "alac", "isomp4", "pcm", "wav", "aiff", "mp3"] }
# Subsonic's specified password + random salt authentication, never password URLs.
md-5 = "0.10"
# `socks` is SOCKS5 proxy support for library requests and update checks. HTTP proxies work without it. `system-proxy` reads the OS
# proxy on macOS and Windows when the mode is System; Linux uses environment
# variables either way.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "json", "gzip", "http2", "blocking", "socks", "system-proxy"] }
# Async requests and local stream/proxy regression servers.
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "fs", "net", "io-util"] }
sha2 = "0.10"
rand = "0.9"
open = "5"

[target.'cfg(not(target_os = "linux"))'.dependencies]
# The desktop's media controls on Windows and macOS, so closing the window
# keeps the music playing there too. Linux has mpris-server below.
souvlaki = { version = "0.8", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1.0.2", features = ["keychain"] }
# Read the native window frame, screen scale and fullscreen mode.
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSResponder", "NSScreen", "NSView", "NSWindow", "objc2-core-foundation"] }

[target.'cfg(windows)'.dependencies]
windows-native-keyring-store = { version = "1.1", default-features = false }
# A hidden window for the media controls to belong to, and message loops.
windows-sys = { version = "0.60", features = ["Win32_Foundation", "Win32_Globalization", "Win32_Graphics_Gdi", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_LibraryLoader", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_Accessibility", "Win32_UI_HiDpi", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "linux")'.dependencies]
# Native theme-file notifications preserve reloads without polling.
notify = "8.2"
# Reuses the zbus/Tokio stack already used for desktop integration.
zbus-secret-service-keyring-store = { version = "1.0.1", features = ["rt-tokio-crypto-rust"] }
mpris-server = { version = "0.10", features = ["tokio"] }
# The local control interface shares the MPRIS bus and Tokio runtime.
zbus = { version = "5", default-features = false, features = ["tokio"] }
# Preserve X11 window placement and fullscreen state.
x11rb = { version = "0.13", default-features = false }

[build-dependencies]
# Drops unfinished PO entries and compiles catalog text and gettext plural
# expressions to Rust. Ordinary builds do not need gettext tools.
include-po = "0.2"
polib = "0.3"

[dev-dependencies]
base64 = "0.22"

# Checks that every catalog covers the template and keeps its placeholders.
polib = "0.3"
# Run connection-deadline regressions with a virtual clock.
tokio = { version = "1", features = ["test-util"] }

# The icon and version information Windows shows for the executable.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[features]
default = []
# Deterministic native previews and screenshot flags, excluded from releases.
navidrome-demo = []

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

# Audio decoding and native layout are too slow at opt-level 0 to
# audition the app in development. Keep every dependency optimized while the
# application crate itself stays incremental.
[profile.dev.package."*"]
opt-level = 2

[patch.crates-io]
# Rune still uses this window backend. Keep the existing shared fixes and revision.
winit = { git = "https://github.com/crmne/winit", rev = "fb8b24c3ec3f2c499daa92aeb4e783a8efa2e973" }
