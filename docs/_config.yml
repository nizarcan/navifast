title: Navifast
description: A fast, lightweight Navidrome app for Linux, macOS, and Windows.
lang: en-US
timezone: Europe/Berlin
url: https://nizarcan.github.io
baseurl: "/navifast"
logo: /assets/images/logo.svg
image: /screenshot.png

markdown: kramdown
kramdown:
  input: GFM

permalink: pretty
theme: jekyll-vitepress-theme

collections:
  guide:
    output: true
    permalink: "/:name/"
  reference:
    output: true
    permalink: "/:name/"
  legacy:
    output: true
    permalink: "/:name/"

defaults:
  - scope:
      path: ""
    values:
      layout: default
      image: /screenshot.png
      topics:
        - Navidrome client
        - Rust
        - Rune
        - OpenSubsonic
        - local playback
        - Linux music player
  - scope:
      type: guide
    values:
      layout: default
  - scope:
      type: reference
    values:
      layout: default

jekyll_vitepress:
  seo:
    page_type: TechArticle
    image:
      path: /screenshot.png
      alt: Navifast showing a Navidrome album with demonstration content
    publisher:
      type: Person
      name: Navifast contributors
      url: https://github.com/nizarcan/navifast
      same_as:
        - https://github.com/nizarcan/navifast
  llms:
    title: Navifast
    description: >-
      Documentation for a native Navidrome client for Linux, macOS,
      and Windows. It covers local playback, library access, and server connections.
    full: true
    details: >-
      Covers installation, sign-in, everyday use, settings, and Navidrome
      connections. Source is on
      [GitHub](https://github.com/nizarcan/navifast).
  branding:
    site_title: Navifast
    logo:
      default: /assets/images/logo.svg
      alt: Navifast
  syntax:
    light_theme: github
    dark_theme: github.dark
  footer:
    enabled: true
    show_on_docs: false
    message: Native Navidrome client. Built on the upstream native Rust foundation.
    copyright: MIT license. Original work by Carmine Paolino and contributors.
  doc_footer:
    enabled: true
    previous_label: Previous page
    next_label: Next page
  last_updated:
    enabled: true
    text: Last updated
    format: "%Y-%m-%d %H:%M"
  edit_link:
    enabled: true
    pattern: "https://github.com/nizarcan/navifast/edit/main/docs/:path"
    text: Edit this page on GitHub
  github_star:
    enabled: true
    repository: nizarcan/navifast
    text: Star
    show_count: true

plugins:
  - jekyll-redirect-from
  - jekyll-vitepress-theme

exclude:
  - _site
  - .jekyll-cache
  - .sass-cache
  - .bundle
  - vendor
  - Gemfile
  - Gemfile.lock
