name: Packaging

on:
  push:
    branches: [main, master]
    paths: [native-packages.yaml, packaging/**, contrib/omarchy/**, .github/workflows/packaging.yml, .github/workflows/release.yml]
  pull_request:
    paths: [native-packages.yaml, packaging/**, contrib/omarchy/**, .github/workflows/packaging.yml, .github/workflows/release.yml]
  workflow_dispatch:
    inputs:
      version:
        description: Published Navifast version (empty runs source checks)
        type: string
        default: ''
      publish:
        description: Attach packages and run enabled downstream publishers
        type: boolean
        default: false
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      publish:
        type: boolean
        default: true
    secrets:
      AUR_SSH_KEY:
        required: false
      AUR_KNOWN_HOSTS:
        required: false
      HOMEBREW_TAP_GITHUB_TOKEN:
        required: false
      HOMEBREW_TAP_SSH_KEY:
        required: false

permissions:
  contents: read

jobs:
  source-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Packaging source regressions
        run: |
          python3 packaging/test-launchers.py
          python3 packaging/test-release-names.py
          python3 packaging/macos/test-signing.py
          python3 packaging/flatpak/test-metainfo.py
          bash -n packaging/test-install.sh

  packaging:
    # The fork has no published binaries yet. Do not pass upstream Spotify
    # releases off as Navifast packages; validate a real fork release explicitly.
    if: inputs.version != ''
    permissions:
      contents: write
    uses: crmne/native-packages/.github/workflows/package.yml@999768410cf53cdc68c8679c09cb14de1a6bca7b # v0.8.1
    with:
      targets: linux-amd64,linux-arm64
      version: ${{ inputs.version }}
      publish: ${{ inputs.publish == true && inputs.version != '' }}
    secrets: inherit

  homebrew:
    name: Homebrew install (macOS)
    needs: packaging
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: native-packages
          path: dist/native-packages
      - name: Install and remove the generated cask
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
        run: |
          brew tap-new --no-git navifast/validation
          tap="$(brew --repository)/Library/Taps/navifast/homebrew-validation"
          mkdir -p "$tap/Casks"
          cp dist/native-packages/recipes/homebrew/navifast.rb "$tap/Casks/navifast.rb"
          brew install --cask navifast/validation/navifast
          app=/Applications/Navifast.app
          executable=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Contents/Info.plist")
          "$app/Contents/MacOS/$executable" --version
          codesign --verify --strict "$app"
          brew uninstall --cask navifast/validation/navifast
          test ! -e "$app"

  # The AppImage carries no libraries of its own, so the runner supplies
  # ALSA as a desktop would. Runners have no FUSE: it unpacks itself to run.
  appimage:
    name: AppImage (${{ matrix.os }})
    needs: packaging
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux-amd64
            arch: x86_64
          - os: ubuntu-24.04-arm
            target: linux-arm64
            arch: aarch64
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: native-packages
          path: dist/native-packages
      - name: Run the AppImage
        env:
          TARGET: ${{ matrix.target }}
          ARCH: ${{ matrix.arch }}
        run: |
          sudo apt-get update
          # The AppImage bundles no libraries, so it needs what the DEB depends on.
          sudo apt-get install -y --no-install-recommends \
            libdbus-1-3 libgl1 libegl1 libvulkan1 libxkbcommon0 libxkbcommon-x11-0 \
            libwayland-client0 libwayland-cursor0 libwayland-egl1 libx11-6 \
            libx11-xcb1 libxcursor1 libxi6 libxrandr2 libasound2t64 libpulse0
          set -- dist/native-packages/packages/"$TARGET"/appimage/navifast-*-"$ARCH".AppImage
          test "$#" -eq 1
          chmod +x "$1"
          "$1" --appimage-extract-and-run --version | grep -Ex '(navifast|fastpotify) [0-9]+\.[0-9]+\.[0-9]+.*'

  installation:
    name: Install (${{ matrix.os }}, ${{ matrix.image }})
    needs: packaging
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
        image: ['ubuntu:24.04', 'debian:13-slim', 'fedora:41', 'fedora:latest']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          name: native-packages
          path: dist/native-packages
      - name: Download the upstream package for coexistence checks
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ${{ matrix.image }}
        run: |
          case "$(uname -m)" in
            x86_64) deb_arch=amd64; rpm_arch=x86_64 ;;
            aarch64) deb_arch=arm64; rpm_arch=aarch64 ;;
          esac
          case "$IMAGE" in
            ubuntu:*|debian:*) file="fastpotify_0.8.0_${deb_arch}.deb" ;;
            fedora:*) file="fastpotify-0.8.0-1.${rpm_arch}.rpm" ;;
          esac
          mkdir -p dist/legacy
          gh release download v0.8.0 --repo crmne/spotifast \
            --pattern "$file" --dir dist/legacy
          cp packaging/fixtures/fastpotify-0.8.0-checksums.txt dist/legacy/packaging-checksums.txt
          cd dist/legacy
          awk -v file="$file" '$2 == file { print }' packaging-checksums.txt > input-checksum.txt
          test -s input-checksum.txt
          sha256sum --check input-checksum.txt
      - name: Release filename regression checks
        run: python3 packaging/test-release-names.py
      - name: Install and check runtime libraries in a clean container
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          bash packaging/test-install.sh "$IMAGE" dist/native-packages dist/legacy
