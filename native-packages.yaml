# Shared CLI: gem install native-packages --version 0.8.1
---
schema: 1
tool:
  version: 0.8.1
  nfpm: 2.47.0
# Ubuntu 24.04 and Debian 13 use the ALSA t64 package name. Override ELF
# inference as well as the explicit dependencies below.
libraries:
  libasound.so.2:
    deb: libasound2t64
    rpm: alsa-lib
nfpm:
  name: navifast
  maintainer: Navifast contributors
  homepage: https://github.com/nizarcan/navifast
  description: A native Navidrome client
  license: MIT
  contents:
  # A glob source makes nFPM append its basename to the destination directory.
  - src: "@PAYLOAD@/*-v@VERSION@-@TARGET@/navifast"
    dst: "/usr/bin/"
    file_info:
      mode: 493
  - src: "@PAYLOAD@/*-v@VERSION@-@TARGET@/LICENSE"
    dst: "/usr/share/licenses/navifast/"
    file_info:
      mode: 420
  - src: "@PAYLOAD@/*-v@VERSION@-@TARGET@/README.md"
    dst: "/usr/share/doc/navifast/"
    file_info:
      mode: 420
  # Retain the input release's launcher identity: current builds use Navifast,
  # while historical binaries still advertise the Fastpotify window class.
  - src: "@PAYLOAD@/*-v@VERSION@-@TARGET@/packaging/applications/*.desktop"
    dst: "/usr/share/applications/"
    file_info:
      mode: 420
  - src: "@PAYLOAD@/*-v@VERSION@-@TARGET@/packaging/icons/*.svg"
    dst: "/usr/share/icons/hicolor/scalable/apps/"
    file_info:
      mode: 420
  - src: contrib/omarchy/navifast.json.tpl
    dst: /usr/share/navifast/omarchy/navifast.json.tpl
    file_info:
      mode: 420
  - src: contrib/omarchy/navifast-theme
    dst: /usr/share/navifast/omarchy/navifast-theme
    file_info:
      mode: 493
  overrides:
    # ELF inspection cannot discover the GUI's dlopen dependencies. Keep
    # these aligned with winit/glutin/rfd and packaging/check-runtime-libs.c.
    deb:
      depends:
      - libdbus-1-3
      - libc6 (>= 2.39)
      - libgl1
      - libvulkan1
      - libegl1
      - libxkbcommon0
      - libxkbcommon-x11-0
      - libwayland-client0
      - libwayland-cursor0
      - libwayland-egl1
      - libx11-6
      - libx11-xcb1
      - libxcursor1
      - libxi6
      - libxrandr2
      - libasound2t64
      - libpulse0
      - libgcc-s1
      - libstdc++6
    rpm:
      depends:
      - dbus-libs
      - glibc >= 2.39
      - libglvnd-glx
      - vulkan-loader
      - libglvnd-egl
      - libxkbcommon
      - libxkbcommon-x11
      - libwayland-client
      - libwayland-cursor
      - libwayland-egl
      - libX11
      - libX11-xcb
      - libXcursor
      - libXi
      - libXrandr
      - alsa-lib
      - pulseaudio-libs
      - libgcc
      - libstdc++
  rpm:
    buildhost: github-actions
targets:
  macos-universal:
    platform: macos
    arch: universal
    formats: [dmg]
    input:
      kind: directory
      local: dist/macos-input
    native:
      command: [ruby, packaging/macos/dmg.rb, '@PAYLOAD@', '@PACKAGE@']
      output: 'navifast-@TAG@-macos-universal.dmg'
  linux-amd64:
    platform: linux
    arch: amd64
    libc: glibc
    compiler_target: x86_64-unknown-linux-gnu
    formats:
    - deb
    - rpm
    - appimage
    input:
      local: dist/navifast-v@VERSION@-x86_64-unknown-linux-gnu.tar.gz
      release_asset: navifast-v@VERSION@-x86_64-unknown-linux-gnu.tar.gz
  linux-arm64:
    platform: linux
    arch: arm64
    libc: glibc
    compiler_target: aarch64-unknown-linux-gnu
    formats:
    - deb
    - rpm
    - appimage
    input:
      local: dist/navifast-v@VERSION@-aarch64-unknown-linux-gnu.tar.gz
      release_asset: navifast-v@VERSION@-aarch64-unknown-linux-gnu.tar.gz
release:
  repository: nizarcan/navifast
  prereleases: true
  checksums: checksums.txt
assets:
  AMD64:
    file: navifast-v@VERSION@-x86_64-unknown-linux-gnu.tar.gz
    local: dist/navifast-v@VERSION@-x86_64-unknown-linux-gnu.tar.gz
  ARM64:
    file: navifast-v@VERSION@-aarch64-unknown-linux-gnu.tar.gz
    local: dist/navifast-v@VERSION@-aarch64-unknown-linux-gnu.tar.gz
  SOURCE:
    file: navifast-v@VERSION@-source.tar.gz
    local: dist/navifast-v@VERSION@-source.tar.gz
  MACOS:
    file: navifast-v@VERSION@-macos-universal.dmg
    local: dist/navifast-v@VERSION@-macos-universal.dmg
templates:
  arch/navifast/PKGBUILD: packaging/arch/navifast/PKGBUILD.in
  arch/navifast/navifast.install: packaging/arch/navifast.install
  arch/navifast-bin/PKGBUILD: packaging/arch/navifast-bin/PKGBUILD.in
  arch/navifast-bin/navifast-bin.install: packaging/arch/navifast.install
  arch/navifast-git/PKGBUILD: packaging/arch/navifast-git/PKGBUILD.in
  arch/navifast-git/navifast-git.install: packaging/arch/navifast.install
  homebrew/navifast.rb: packaging/homebrew/navifast.rb.in
repositories:
  aur-source:
    group: aur
    url: https://aur.archlinux.org/navifast.git
    push_url: ssh://aur@aur.archlinux.org/navifast.git
    branch: master
    package_path: "."
    files:
      arch/navifast: "."
    version_file: ".SRCINFO"
    version_pattern: "^\\s*pkgver = (\\S+)"
    publish: push
  aur-bin:
    group: aur
    url: https://aur.archlinux.org/navifast-bin.git
    push_url: ssh://aur@aur.archlinux.org/navifast-bin.git
    branch: master
    package_path: "."
    files:
      arch/navifast-bin: "."
    version_file: ".SRCINFO"
    version_pattern: "^\\s*pkgver = (\\S+)"
    publish: push
  aur-git:
    group: aur
    url: https://aur.archlinux.org/navifast-git.git
    push_url: ssh://aur@aur.archlinux.org/navifast-git.git
    branch: master
    package_path: "."
    files:
      arch/navifast-git: "."
    version_file: ".SRCINFO"
    version_pattern: "^\\s*pkgver = (\\S+)"
    publish: push
  homebrew:
    url: https://github.com/nizarcan/homebrew-tap.git
    push_url: https://github.com/nizarcan/homebrew-tap.git
    branch: main
    package_path: Casks
    files:
      homebrew/navifast.rb: Casks/navifast.rb
    version_file: Casks/navifast.rb
    version_pattern: version "([^"]+)"
    publish: push
version_file: Cargo.toml
